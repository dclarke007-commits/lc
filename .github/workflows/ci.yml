name: CI

# Gate every push and PR: typecheck + Vitest integration + Playwright E2E, all against
# a real Postgres 16 service. Mirrors the local Docker setup, except CI talks to plain
# Postgres directly (no pgBouncer) — DATABASE_URL and DIRECT_URL both point at :5432.
on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loves
          POSTGRES_PASSWORD: loves
          POSTGRES_DB: lovescleaning
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the steps run.
        options: >-
          --health-cmd "pg_isready -U loves -d lovescleaning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # App runtime + drizzle-kit both use the direct :5432 connection in CI.
      DATABASE_URL: postgres://loves:loves@localhost:5432/lovescleaning
      DIRECT_URL: postgres://loves:loves@localhost:5432/lovescleaning
      # Operator seed (seedOperator is idempotent; tests + global-setup call it).
      OPERATOR_EMAIL: operator@example.com
      OPERATOR_PASSPHRASE: ci-operator-passphrase-please-change-in-prod
      # Distinct HMAC secrets (key separation) — CI-only test values, not real secrets.
      SESSION_SECRET: ci-session-secret-0123456789-abcdefghijklmnop
      CLIENT_TOKEN_SECRET: ci-client-token-secret-0123456789-abcdefghij
      PUBLIC_TOKEN_SECRET: ci-public-token-secret-9876543210-zyxwvutsrq
      APP_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        # Third-party action pinned to a full commit SHA (v4.1.0) for supply-chain safety.
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Integration tests (Vitest)
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm test:e2e:install

      - name: E2E tests (Playwright)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
